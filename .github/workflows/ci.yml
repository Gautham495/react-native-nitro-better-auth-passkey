name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack + Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - name: Configure Yarn for CI
        run: |
          if [ -f .yarnrc.yml ]; then mv .yarnrc.yml .yarnrc.yml.backup; fi
          cat > .yarnrc.yml << 'EOF'
          nodeLinker: node-modules
          enableGlobalCache: false
          EOF

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - name: Configure Yarn for CI
        run: |
          if [ -f .yarnrc.yml ]; then mv .yarnrc.yml .yarnrc.yml.backup; fi
          cat > .yarnrc.yml << 'EOF'
          nodeLinker: node-modules
          enableGlobalCache: false
          EOF

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Generate Nitro bindings
        run: yarn specs

      - name: Build package
        run: yarn build

      - name: Verify build output
        run: |
          test -f lib/index.js
          test -f lib/index.d.ts